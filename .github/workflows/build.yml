name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "revision=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "revision=0.0.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: mvn -B package -Drevision=${{ steps.version.outputs.revision }}

      - uses: actions/upload-artifact@v4
        with:
          name: stravatracer
          path: target/stravatracer.jar

      # The JOSM plugin list points to releases/latest/download/stravatracer.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/stravatracer.jar
          generate_release_notes: true
